<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 16px;
        }
        .card {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            padding: 24px 28px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 22px;
            margin: 0 0 20px;
        }
        label.judul {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="date"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .hobi label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }
        button {
            margin-top: 12px;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background: #0069d9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Formulir Data Diri</h1>

        <form action="tugas9.php" method="POST">
            <label class="judul" for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>

            <label class="judul" for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>

            <span class="judul" style="display:block;font-weight:bold;font-size:14px;margin-bottom:6px;">Hobi:</span>
            <div class="hobi">
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>

            <button type="submit">Kirim</button>
        </form>
    </div>
</body>
</html>
